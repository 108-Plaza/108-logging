# Managed by 108-Plaza/108-logging (collector). Ships this host's journald to VictoriaLogs.
data_dir: /data/yuth/logging/vector-data
api:
  enabled: false
sources:
  journal:
    type: journald
    since_now: true
transforms:
  shape:
    type: remap
    inputs: [journal]
    source: |
      unit = .SYSTEMD_USER_UNIT || ._SYSTEMD_USER_UNIT || ._SYSTEMD_UNIT || .SYSLOG_IDENTIFIER || "unknown"
      # A command run from an ssh login lands in session-<n>.scope; name it by its syslog tag instead,
      # so ad-hoc scripts do not open a new stream per login.
      if starts_with(to_string(unit) ?? "", "session-") && exists(.SYSLOG_IDENTIFIER) { unit = .SYSLOG_IDENTIFIER }
      raw = to_string(.message) ?? ""
      parsed, err = parse_json(raw)
      out = {}
      if err == null && is_object(parsed) {
        out = object!(parsed)
        if !exists(out.message) { out.message = raw }
      } else {
        out.message = raw
      }
      out.timestamp = .timestamp
      out.host = .host
      out.unit = unit
      if !exists(out.service) { out.service = replace(to_string(unit) ?? "unknown", r'\.service$', "") }
      # One level vocabulary, the log108 one: error | warn | info | debug | trace.
      # Non-JSON lines only carry journald PRIORITY (0-7); keep it as `priority`.
      out.priority = .PRIORITY
      if !exists(out.level) {
        p = to_int(.PRIORITY) ?? 6
        out.level = if p <= 3 { "error" } else if p == 4 { "warn" } else if p <= 6 { "info" } else { "debug" }
      } else {
        lv = downcase(to_string(out.level) ?? "")
        if lv == "warning" { lv = "warn" }
        if lv == "err" || lv == "critical" || lv == "crit" || lv == "fatal" || lv == "emerg" || lv == "alert" { lv = "error" }
        if lv == "notice" { lv = "info" }
        out.level = lv
      }
      . = out
sinks:
  vlogs:
    type: elasticsearch
    inputs: [shape]
    endpoints: ["http://127.0.0.1:9428/insert/elasticsearch/"]
    mode: bulk
    api_version: v8
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: host,service
